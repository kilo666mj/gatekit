name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Stable display name for the branch-protection required check. Keep this
    # value fixed even if steps change, or required-check references break.
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: Check go.mod is tidy
        # A library's go.mod is part of its public contract: a stale require
        # or a missing sum breaks every consumer's build, not just this repo's.
        #
        # git status rather than git diff: a repo with no third-party
        # dependencies has no go.sum, and `git diff go.sum` fails outright on a
        # path that does not exist. status also catches tidy *creating* a
        # go.sum, which diff against the index would miss.
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            echo "go.mod/go.sum are not tidy; run 'go mod tidy':"
            git status --porcelain -- go.mod go.sum
            git diff -- go.mod
            exit 1
          fi
      - name: Test
        run: go test -race ./...

  # Preserve the declared minimum above while proving compatibility with the
  # current Go release used by sshgate and tlsgate.
  build:
    name: Go 1.27.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
